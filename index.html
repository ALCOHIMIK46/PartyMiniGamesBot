<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRASH PARTY: PROJECT X</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik+Glitch&display=swap" rel="stylesheet">
    <style>
        :root {
            --acid-green: #ccff00;
            --hot-pink: #ff00ff;
            --electric-blue: #00ffff;
            --void-black: #111;
            --warning-red: #ff3333;
            --party-purple: #9d00ff;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            background-color: var(--void-black);
            background-image: repeating-linear-gradient(45deg, #050505 0px, #050505 20px, #111 20px, #111 40px);
            color: var(--acid-green);
            font-family: 'Bangers', cursive;
            overflow: hidden; height: 100vh; width: 100vw;
            display: flex; align-items: center; justify-content: center;
        }

        .container {
            width: 100%; height: 100%; max-width: 600px;
            background: rgba(0, 0, 0, 0.95);
            padding: 15px; position: relative;
            text-align: center;
            display: flex; flex-direction: column; justify-content: center;
            overflow-y: auto; 
        }

        h1, h2 {
            font-family: 'Rubik Glitch', cursive;
            font-size: 2.2rem; margin: 10px 0;
            color: var(--hot-pink);
            text-shadow: 2px 2px 0px var(--acid-green);
            animation: glitch 3s infinite;
            line-height: 1;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px 0px var(--acid-green); }
            20% { text-shadow: -2px 2px 0px var(--electric-blue); }
            40% { text-shadow: -2px -2px 0px var(--warning-red); }
            60% { text-shadow: 2px -2px 0px var(--hot-pink); }
            100% { text-shadow: 2px 2px 0px var(--acid-green); }
        }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; background: #000; border: 2px solid var(--acid-green); color: white; font-family: 'Bangers', cursive; font-size: 1.2rem; padding: 10px; outline: none; border-radius: 8px; }

        .btn {
            background: var(--hot-pink); color: white; border: none;
            padding: 15px; font-family: 'Bangers', cursive; font-size: 1.4rem;
            cursor: pointer; box-shadow: 4px 4px 0px var(--electric-blue);
            text-transform: uppercase; width: 100%; margin-bottom: 15px;
            position: relative; border-radius: 8px;
        }
        .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--electric-blue); }
        
        .btn-back { width: auto; position: absolute; top: 10px; left: 10px; font-size: 1rem; padding: 8px 15px; z-index: 100; transform: rotate(-2deg); }

        .player-list { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 20px; }
        .player-tag { background: var(--electric-blue); color: #000; padding: 5px 10px; font-size: 1.1rem; border-radius: 5px; transform: rotate(var(--rot)); }

        .screen { display: none; height: 100%; flex-direction: column; justify-content: center; }
        .screen.active { display: flex; animation: fadeUp 0.3s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Roulette Styles */
        .cylinder { width: 140px; height: 140px; border-radius: 50%; border: 8px dashed var(--electric-blue); margin: 20px auto; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; transition: transform 0.5s cubic-bezier(0.25, 0.1, 0.25, 1); }

        /* Clicker Styles */
        .click-area { width: 180px; height: 180px; background: var(--warning-red); border-radius: 50%; margin: 10px auto; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; border: 5px solid white; box-shadow: 0 0 15px var(--warning-red); cursor: pointer; }
        .click-area:active { transform: scale(0.95); }

        /* --- PARTY MODE STYLES --- */
        .party-box {
            border: 2px solid var(--party-purple);
            background: #1a0022;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: left;
            box-shadow: 5px 5px 0px #440055;
            position: relative;
        }
        .party-hero { color: var(--party-purple); font-size: 1.5rem; margin-bottom: 10px; display: block; text-transform: uppercase; border-bottom: 1px dashed #550066; padding-bottom: 5px;}
        .party-text { font-size: 1.2rem; color: white; margin-bottom: 10px; line-height: 1.3; }
        
        #party-choices { display: flex; flex-direction: column; gap: 10px; }
        .party-btn-opt { background: #333; font-size: 1.1rem; border: 1px solid white; margin-bottom: 0; padding: 12px; white-space: normal; line-height: 1.1; }
        
        .party-result-box {
            background: #000; border: 2px dashed var(--acid-green); padding: 15px; margin-top: 15px;
            display: none; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .task-header { color: var(--warning-red); font-size: 1.4rem; margin: 10px 0 5px 0; text-decoration: underline; }
        .task-text { color: white; font-size: 1.3rem; line-height: 1.2; }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    </style>
</head>

    <div class="container">

        t: "💩 КТО-ТО БЛЕВАНУЛ В КОРИДОРЕ. КТО ВОССТАНОВИТ ПОРЯДОК?",

        c2: "НАЗВАТЬ ЕГО И ОСТАВИТЬ КАК ТАЛИСМАН", 
        c3: "ПЕРЕКРОИТЬ КОВЕР ПОД ЭТУ КОМПОЗИЦИЮ", 
        r1: {x: "Никто не оценил твое искусство. Варвары.", a: "СОЗДАЙ скульптуру из любого предмета."}, 
        r2: {x: "Талисман приносит удачу! Странно, но факт.", a: "РАССКАЖИ: самая отвратительная вещь, которую ты делал(а)?"},

    {

    // --- LOGIC ---
    let players = [];
    let selectedGame = null;
    let currentScenario = null; 
    
    function handleEnter(e) { if(e.key === 'Enter') addPlayer(); }
    function addPlayer() {
        const input = document.getElementById('playerName');
        const name = input.value.trim();
        if (name && !players.includes(name)) {
            players.push(name);
            renderPlayers();
            input.value = ''; input.focus();
        }
    }
    function renderPlayers() {
        document.getElementById('playersDisplay').innerHTML = players.map(p => `<span class="player-tag" style="--rot: ${Math.random()*10-5}deg">${p}</span>`).join('');
    }
    function selectGame(gameType) { selectedGame = gameType; showScreen('screen-setup'); }
    function launchSelectedGame() {
        if (players.length < 2) { tgAlert("Нужно минимум 2 игрока!"); return; }
        if (selectedGame === 'roulette') initRoulette();
        else if (selectedGame === 'clicker') initClicker();
        else if (selectedGame === 'rps') initRPS();
        else if (selectedGame === 'party') initParty(); 
    }
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
    function getRandomPlayer() { return players[Math.floor(Math.random() * players.length)]; }

    // --- ROULETTE ---
    let chambers, bulletPos, currentChamber, roulettePlayerIndex;
    function initRoulette() {
        showScreen('screen-roulette');
        chambers = 6; currentChamber = 0; bulletPos = Math.floor(Math.random() * 6); 
        roulettePlayerIndex = Math.floor(Math.random() * players.length);
        document.getElementById('roulette-msg').innerText = "Барабан прокручен...";
        document.getElementById('roulette-msg').style.color = "white";
        document.getElementById('cylinder').style.transform = "rotate(0deg)";
        document.getElementById('cylinder').innerText = "💀";
        document.getElementById('fire-btn').style.display = "inline-block";
        document.getElementById('reset-roulette-btn').style.display = "none";
        document.body.style.backgroundColor = "var(--void-black)";
        updateRoulettePlayer();
    }
    function updateRoulettePlayer() { document.getElementById('roulette-player').innerText = "Стреляет: " + players[roulettePlayerIndex]; }
    function fireRoulette() {
        haptic('heavy');
        const cyl = document.getElementById('cylinder');
        cyl.style.transform = `rotate(${360 + (currentChamber * 60)}deg)`;
        setTimeout(() => {
            if (currentChamber === bulletPos) {
                document.getElementById('roulette-msg').innerText = "ВЫСТРЕЛ! ПЕЙ ДО ДНА!";
                document.getElementById('roulette-msg').style.color = "var(--warning-red)";
                cyl.innerText = "💥";
                document.body.style.backgroundColor = "#500";
                document.getElementById('fire-btn').style.display = "none";
                document.getElementById('reset-roulette-btn').style.display = "inline-block";
                haptic('error');
            } else {
                document.getElementById('roulette-msg').innerText = "Щелчок... Живи.";
                document.getElementById('roulette-msg').style.color = "var(--acid-green)";
                currentChamber++;
                roulettePlayerIndex = (roulettePlayerIndex + 1) % players.length;
                updateRoulettePlayer();
            }
        }, 300);
    }

    // --- CLICKER ---
    let clickCount = 0, clickTimerInt = null, clickSessionRecord = 0;
    function initClicker() { showScreen('screen-clicker'); resetClickerUI(); }
    function resetClickerUI() {
        document.getElementById('clicker-player').innerText = "Готовится: " + getRandomPlayer();
        document.getElementById('click-count').innerText = "0";
        document.getElementById('click-timer').innerText = "10.00";
        const btn = document.getElementById('click-btn');
        btn.style.pointerEvents = "none"; btn.style.opacity = "0.5"; btn.innerText = "ЖМИ!";
        document.getElementById('start-clicker-btn').style.display = "inline-block";
        clickCount = 0;
    }
    function startClickerRun() {
        document.getElementById('start-clicker-btn').style.display = "none";
        const btn = document.getElementById('click-btn');
        btn.innerText = "3..."; setTimeout(() => { btn.innerText = "2..."; }, 700); setTimeout(() => { btn.innerText = "1..."; }, 1400);
        setTimeout(() => {
            btn.innerText = "🔥"; btn.style.pointerEvents = "auto"; btn.style.opacity = "1"; btn.style.background = "var(--hot-pink)";
            haptic('warning');
            const startTime = Date.now();
            clickTimerInt = setInterval(() => {
                let elapsed = (Date.now() - startTime) / 1000;
                let left = 10 - elapsed;
                if (left <= 0) endClickerGame(); else document.getElementById('click-timer').innerText = left.toFixed(2);
            }, 50);
        }, 2100);
    }
    function countClick() {
        clickCount++;
        document.getElementById('click-count').innerText = clickCount;
        if(clickCount % 5 === 0) haptic('light');
        const btn = document.getElementById('click-btn');
        btn.style.transform = "scale(0.9)"; setTimeout(() => btn.style.transform = "scale(1)", 50);
    }
    function endClickerGame() {
        clearInterval(clickTimerInt);
        document.getElementById('click-timer').innerText = "0.00";
        const btn = document.getElementById('click-btn');
        btn.style.pointerEvents = "none"; btn.style.opacity = "0.5"; btn.style.background = "var(--warning-red)"; btn.innerText = "СТОП";
        let msg = (clickCount > clickSessionRecord) ? `🔥 НОВЫЙ РЕКОРД: ${clickCount}` : `Результат: ${clickCount}`;
        if(clickCount > clickSessionRecord) clickSessionRecord = clickCount;
        document.getElementById('clicker-record').innerText = "Рекорд: " + clickSessionRecord;
        if(tg.showPopup) tg.showPopup({ title: 'Финиш', message: msg, buttons: [{type: 'ok'}] }); else alert(msg);
        setTimeout(resetClickerUI, 2000);
    }

    // --- ALKO-DVIZH (PARTY QUEST) ---
    function initParty() { showScreen('screen-party'); nextPartyTurn(); }
    function nextPartyTurn() {
        document.getElementById('party-choices').style.display = "flex";
        document.getElementById('party-result').style.display = "none";
        
        document.getElementById('party-hero').innerText = "Герой: " + getRandomPlayer();
        
        currentScenario = partyScenarios[Math.floor(Math.random() * partyScenarios.length)];
        
        document.getElementById('party-scenario-text').innerText = currentScenario.t;
        document.getElementById('party-choice-1').innerText = currentScenario.c1;
        document.getElementById('party-choice-2').innerText = currentScenario.c2;
        document.getElementById('party-choice-3').innerText = currentScenario.c3;
    }
    function choosePartyPath(idx) {
        haptic('heavy');
        document.getElementById('party-choices').style.display = "none";
        const resBox = document.getElementById('party-result');
        resBox.style.display = "block";
        
        let outcome;
        if (idx === 0) outcome = currentScenario.r1;
        else if (idx === 1) outcome = currentScenario.r2;
        else outcome = currentScenario.r3;
        
        document.getElementById('party-outcome-text').innerText = outcome.x;
        document.getElementById('party-real-task').innerText = outcome.a;
        haptic('success');
    }

    // --- RPS ---
    function initRPS() {
        showScreen('screen-rps');
        document.getElementById('rps-player-name').innerText = getRandomPlayer() + ", твой ход!";
        document.getElementById('rps-result').innerText = "";
    }
    function playRPS(choice) {
        const bots = ['rock', 'paper', 'scissors'];
        const botChoice = bots[Math.floor(Math.random() * 3)];
        const resDiv = document.getElementById('rps-result');
        let msg = "";
        if (choice === botChoice) { msg = "НИЧЬЯ! ПЕЙ!"; resDiv.style.color = "white"; }
        else if ((choice === 'rock' && botChoice === 'scissors') || (choice === 'paper' && botChoice === 'rock') || (choice === 'scissors' && botChoice === 'paper')) { 
            msg = "ПОБЕДА!"; resDiv.style.color = "var(--acid-green)"; haptic('success');
        } else { 
            msg = "ЛУЗЕР! ПЕЙ!"; resDiv.style.color = "var(--warning-red)"; haptic('error');
        }
        resDiv.innerHTML = `Комп: ${botChoice === 'rock'?'🗿':(botChoice==='paper'?'🧻':'✂️')} <br> ${msg}`;
        setTimeout(() => {
            document.getElementById('rps-player-name').innerText = getRandomPlayer() + ", теперь ты!";
            resDiv.innerText = "";
        }, 2000);
    }
</script>
