<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRASH PARTY GAMES 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik+Glitch&display=swap" rel="stylesheet">
    <style>
        :root {
            --acid-green: #ccff00;
            --hot-pink: #ff00ff;
            --electric-blue: #00ffff;
            --void-black: #111;
            --warning-red: #ff3333;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--void-black);
            background-image: repeating-linear-gradient(45deg, #111 0px, #111 20px, #222 20px, #222 40px);
            color: var(--acid-green);
            font-family: 'Bangers', cursive;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Chaos Background Animation */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255,0,255,0.1), transparent);
            animation: pulse 2s infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.5); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        .container {
            width: 95%;
            max-width: 600px;
            border: 5px solid var(--electric-blue);
            background: rgba(0, 0, 0, 0.95);
            padding: 20px;
            box-shadow: 10px 10px 0px var(--hot-pink);
            position: relative;
            text-align: center;
        }

        h1, h2 {
            font-family: 'Rubik Glitch', cursive;
            font-size: 2.8rem;
            margin: 10px 0;
            color: var(--hot-pink);
            text-shadow: 3px 3px 0px var(--acid-green);
            animation: glitch 3s infinite;
            line-height: 1;
        }

        @keyframes glitch {
            0% { text-shadow: 3px 3px 0px var(--acid-green); }
            20% { text-shadow: -3px 3px 0px var(--electric-blue); }
            40% { text-shadow: -3px -3px 0px var(--warning-red); }
            60% { text-shadow: 3px -3px 0px var(--hot-pink); }
            100% { text-shadow: 3px 3px 0px var(--acid-green); }
        }

        /* INPUTS & LISTS */
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }

        input {
            flex: 1;
            background: #000;
            border: 3px solid var(--acid-green);
            color: white;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            padding: 10px;
            outline: none;
            border-radius: 0;
        }

        .btn {
            background: var(--hot-pink);
            color: white;
            border: none;
            padding: 12px 20px;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 5px 5px 0px var(--electric-blue);
            text-transform: uppercase;
            touch-action: manipulation; /* Улучшает клик на мобилках */
        }

        .btn:active { transform: translate(5px, 5px); box-shadow: none; }
        .btn-danger { background: var(--warning-red); box-shadow: 5px 5px 0px #fff; }
        .btn-menu { width: 100%; margin: 10px 0; font-size: 2rem; }
        .btn-back { position: absolute; top: -20px; left: -20px; font-size: 1rem; transform: rotate(-5deg); z-index: 10;}

        .player-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            min-height: 50px;
        }

        .player-tag {
            background: var(--electric-blue);
            color: #000;
            padding: 5px 10px;
            font-size: 1.2rem;
            transform: rotate(var(--rot));
            border: 2px solid #000;
        }

        /* SECTIONS */
        .screen { display: none; }
        .screen.active { display: block; animation: shake 0.3s ease-out; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* --- GAME SPECIFIC --- */
        
        /* TOD */
        .card-flip {
            background: var(--warning-red);
            color: white;
            padding: 20px;
            font-size: 1.8rem;
            border: 4px dashed yellow;
            margin: 20px 0;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .victim-name { color: var(--acid-green); font-size: 2.5rem; display: block; margin-bottom: 15px; text-shadow: 2px 2px 0 #000; line-height: 1;}

        /* TTT */
        .ttt-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 20px auto;
            max-width: 300px;
        }
        .cell {
            background: #222;
            height: 80px;
            border: 2px solid var(--acid-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
        }
        .cell.X { color: var(--hot-pink); text-shadow: 0 0 10px var(--hot-pink); }
        .cell.O { color: var(--electric-blue); text-shadow: 0 0 10px var(--electric-blue); }
        .versus { font-size: 1.5rem; color: white; margin-bottom: 10px; }

        /* RPS */
        .rps-arena { display: flex; justify-content: space-around; align-items: center; font-size: 3.5rem; margin: 20px 0; }
        .rps-choice { cursor: pointer; transition: 0.2s; padding: 10px; border: 2px solid transparent; }
        .rps-choice:hover, .rps-choice:active { transform: scale(1.2) rotate(10deg); border-color: var(--acid-green); border-radius: 50%; background: #222; }
        .winner-text { font-size: 1.8rem; color: var(--warning-red); min-height: 60px; line-height: 1.2; }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- SETUP SCREEN -->
        <div id="screen-setup" class="screen active">
            <h1>КТО НА ТУСЕ?</h1>
            <p>Впиши имена (минимум 2)</p>
            <div class="input-group">
                <input type="text" id="playerName" placeholder="Имя..." onkeypress="handleEnter(event)" autocomplete="off">
                <button class="btn" onclick="addPlayer()">+</button>
            </div>
            <div class="player-list" id="playersDisplay"></div>
            <button class="btn btn-danger btn-menu" onclick="startGameParams()">ПОГНАЛИ!</button>
        </div>

        <!-- MENU SCREEN -->
        <div id="screen-menu" class="screen">
            <button class="btn btn-back" onclick="showScreen('screen-setup')">Назад</button>
            <h1>ТРЕШ МЕНЮ</h1>
            <button class="btn btn-menu" onclick="initTOD()" style="background: var(--hot-pink)">Правда / Действие</button>
            <button class="btn btn-menu" onclick="initTTT()" style="background: var(--electric-blue)">Крестики Нолики</button>
            <button class="btn btn-menu" onclick="initRPS()" style="background: var(--acid-green); color: black;">Камень Ножницы</button>
        </div>

        <!-- TRUTH OR DARE -->
        <div id="screen-tod" class="screen">
            <button class="btn btn-back" onclick="showScreen('screen-menu')">Меню</button>
            <h2>Правда или ТРЕШ</h2>
            <div class="card-flip">
                <span id="tod-victim" class="victim-name">???</span>
                <span id="tod-task">Жми кнопку снизу!</span>
            </div>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn" style="background: var(--electric-blue); color: black; flex: 1;" onclick="nextTOD('truth')">Правда</button>
                <button class="btn" style="background: var(--warning-red); flex: 1;" onclick="nextTOD('dare')">ДЕЙСТВИЕ</button>
            </div>
        </div>

        <!-- TIC TAC TOE -->
        <div id="screen-ttt" class="screen">
            <button class="btn btn-back" onclick="showScreen('screen-menu')">Меню</button>
            <h2>Бой насмерть</h2>
            <div class="versus" id="ttt-versus"></div>
            <div class="ttt-board" id="ttt-grid"></div>
            <div id="ttt-msg" style="font-size: 1.5rem; margin-top: 10px; min-height: 30px;"></div>
            <button class="btn" style="margin-top:10px;" onclick="initTTT()">Реванш</button>
        </div>

        <!-- RPS -->
        <div id="screen-rps" class="screen">
            <button class="btn btn-back" onclick="showScreen('screen-menu')">Меню</button>
            <h2>ЦУ-Е-ФА</h2>
            <p id="rps-player-name" style="color: var(--electric-blue); font-size: 1.5rem;">Твой ход</p>
            <div class="rps-arena">
                <div class="rps-choice" onclick="playRPS('rock')">🗿</div>
                <div class="rps-choice" onclick="playRPS('paper')">🧻</div>
                <div class="rps-choice" onclick="playRPS('scissors')">✂️</div>
            </div>
            <div class="winner-text" id="rps-result">Выбирай мудро!</div>
        </div>

    </div>

<script>
    let players = [];
    
    // --- SETUP ---
    function handleEnter(e) { if(e.key === 'Enter') addPlayer(); }

    function addPlayer() {
        const input = document.getElementById('playerName');
        const name = input.value.trim();
        if (name) {
            if(players.includes(name)) {
                alert("Такой уже есть! Придумай кликуху.");
                return;
            }
            players.push(name);
            renderPlayers();
            input.value = '';
            input.focus();
        }
    }

    function renderPlayers() {
        const list = document.getElementById('playersDisplay');
        list.innerHTML = players.map(p => 
            `<span class="player-tag" style="--rot: ${Math.random()*10-5}deg">${p}</span>`
        ).join('');
    }

    function startGameParams() {
        if (players.length < 2) {
            alert("Эй! Нужно минимум 2 человека для вечеринки!");
            return;
        }
        showScreen('screen-menu');
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function getRandomPlayer() {
        return players[Math.floor(Math.random() * players.length)];
    }

    // --- TRUTH OR DARE (EXPANDED) ---
    const tasks = {
        truth: [
            "Кто из присутствующих бесит тебя больше всего?",
            "Какое самое тупое сообщение ты отправлял?",
            "Когда последний раз ты не мылся 2 дня?",
            "Покажи последние 3 фото в галерее.",
            "В кого ты был тайно влюблен?",
            "Что ты своровал в магазине?",
            "Назови человека в комнате, с кем бы переспал.",
            "Какую самую дикую ложь ты говорил родителям?",
            "Покажи историю поиска в браузере.",
            "Расскажи о самом позорном сексе (или свидании).",
            "Оцени внешность игрока справа от 1 до 10.",
            "Ты когда-нибудь писал в бассейн во взрослом возрасте?"
        ],
        dare: [
            "Изобрази тверк на 10 секунд.",
            "Дай любому игроку шлепнуть тебя.",
            "Позвони бывшему/бывшей и промяукай.",
            "Выпей стакан воды без рук.",
            "Оближи локоть соседа.",
            "Сделай массаж ног игроку справа.",
            "Пусть другой игрок напишет статус в твоей соцсети.",
            "Сиди на коленях у любого игрока 2 круга.",
            "Съешь ложку горчицы/острого соуса (если есть).",
            "Изображай оргазм глядя в глаза соседу.",
            "Дай понюхать свои подмышки соседу слева.",
            "Обменяйся одеждой (футболкой) с игроком напротив."
        ]
    };

    function initTOD() {
        showScreen('screen-tod');
        document.getElementById('tod-victim').innerText = "???";
        document.getElementById('tod-task').innerText = "Готовьтесь...";
    }

    function nextTOD(type) {
        const list = tasks[type];
        const task = list[Math.floor(Math.random() * list.length)];
        
        const victimEl = document.getElementById('tod-victim');
        const taskEl = document.getElementById('tod-task');
        
        // Animation
        let count = 0;
        const interval = setInterval(() => {
            victimEl.innerText = players[Math.floor(Math.random() * players.length)];
            count++;
            if(count > 10) {
                clearInterval(interval);
                // Ensure random victim works well
                const finalVictim = getRandomPlayer();
                victimEl.innerText = finalVictim;
                taskEl.innerText = task;
                victimEl.style.color = type === 'truth' ? 'var(--electric-blue)' : 'var(--warning-red)';
            }
        }, 50);
    }

    // --- TIC TAC TOE ---
    let tttBoard = [];
    let tttActive = false;
    let tttCurrent = 'X';
    let p1, p2;

    function initTTT() {
        showScreen('screen-ttt');
        let shuffled = [...players].sort(() => 0.5 - Math.random());
        p1 = shuffled[0];
        p2 = shuffled[1];
        
        document.getElementById('ttt-versus').innerHTML = 
            `<span style="color:var(--hot-pink)">${p1}</span> VS <span style="color:var(--electric-blue)">${p2}</span>`;
        
        tttBoard = Array(9).fill(null);
        tttActive = true;
        tttCurrent = 'X';
        document.getElementById('ttt-msg').innerText = '';
        renderTTT();
    }

    function renderTTT() {
        const grid = document.getElementById('ttt-grid');
        grid.innerHTML = '';
        tttBoard.forEach((cell, i) => {
            const div = document.createElement('div');
            div.className = `cell ${cell || ''}`;
            div.innerText = cell || '';
            div.onclick = () => clickTTT(i);
            grid.appendChild(div);
        });
    }

    function clickTTT(i) {
        if (!tttActive || tttBoard[i]) return;
        tttBoard[i] = tttCurrent;
        renderTTT();
        
        if (checkWinTTT()) {
            const winner = tttCurrent === 'X' ? p1 : p2;
            document.getElementById('ttt-msg').innerHTML = `<span style="color:var(--acid-green)">👑 ${winner} ПОБЕДИЛ!</span>`;
            document.getElementById('ttt-msg').style.animation = "glitch 1s infinite";
            tttActive = false;
            return;
        }
        if (!tttBoard.includes(null)) {
            document.getElementById('ttt-msg').innerText = "НИЧЬЯ ДЛЯ СЛАБАКОВ";
            tttActive = false;
            return;
        }
        tttCurrent = tttCurrent === 'X' ? 'O' : 'X';
    }

    function checkWinTTT() {
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        return wins.some(c => tttBoard[c[0]] && tttBoard[c[0]] === tttBoard[c[1]] && tttBoard[c[0]] === tttBoard[c[2]]);
    }

    // --- RPS (Party Mode) ---
    function initRPS() {
        showScreen('screen-rps');
        document.getElementById('rps-player-name').innerText = getRandomPlayer() + ", твой ход!";
        document.getElementById('rps-result').innerText = "";
    }

    function playRPS(choice) {
        const bots = ['rock', 'paper', 'scissors'];
        const botChoice = bots[Math.floor(Math.random() * 3)];
        const resDiv = document.getElementById('rps-result');
        
        let msg = "";
        if (choice === botChoice) {
            msg = "НИЧЬЯ! ПЕЙТЕ ОБА!";
            resDiv.style.color = "white";
        }
        else if (
            (choice === 'rock' && botChoice === 'scissors') ||
            (choice === 'paper' && botChoice === 'rock') ||
            (choice === 'scissors' && botChoice === 'paper')
        ) {
            msg = "КРАСАВА! ТЫ ВЫЖИЛ!";
            resDiv.style.color = "var(--acid-green)";
        } else {
            msg = "ТЫ ПРОИГРАЛ! ПЕЙ ШТРАФНУЮ!";
            resDiv.style.color = "var(--warning-red)";
        }
        
        resDiv.innerHTML = `Комп: ${botChoice === 'rock'?'🗿':(botChoice==='paper'?'🧻':'✂️')}<br>${msg}`;
        
        // Блокируем нажатия на пару секунд
        const buttons = document.querySelectorAll('.rps-choice');
        buttons.forEach(b => b.style.pointerEvents = 'none');

        setTimeout(() => {
            document.getElementById('rps-player-name').innerText = getRandomPlayer() + ", теперь ты!";
            buttons.forEach(b => b.style.pointerEvents = 'auto');
            resDiv.innerText = "Готов?";
            resDiv.style.color = "var(--warning-red)";
        }, 2500);
    }

</script>
</body>
</html>
