<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Важно: запрещаем зум на мобилках, чтобы ощущалось как приложение -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRASH PARTY APP</title>
    
    <!-- Подключение Telegram API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik+Glitch&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --acid-green: #ccff00;
            --hot-pink: #ff00ff;
            --electric-blue: #00ffff;
            --void-black: #111;
            --warning-red: #ff3333;
            --bg-dark: #090909;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Запрет выделения текста */
            -webkit-tap-highlight-color: transparent; /* Убираем синий клик на Андроиде */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--void-black);
            background-image: repeating-linear-gradient(45deg, #050505 0px, #050505 20px, #111 20px, #111 40px);
            color: var(--acid-green);
            font-family: 'Bangers', cursive;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Блокируем скролл всей страницы */
        }

        /* --- ГЛАВНЫЙ КОНТЕЙНЕР (АДАПТИВНЫЙ) --- */
        .app-container {
            position: relative;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Скролл внутри приложения если нужно */
            overflow-x: hidden;
        }

        /* СТИЛИ ДЛЯ МОБИЛЬНЫХ (По умолчанию) */
        .app-container {
            width: 100%;
            height: 100%;
            border: none;
            padding: 15px;
        }

        /* СТИЛИ ДЛЯ КОМПЬЮТЕРА (Если экран шире 768px) */
        @media (min-width: 768px) {
            .app-container {
                width: 400px; /* Ширина как у мобилки */
                height: 85vh; /* Не на весь экран, а с отступами */
                max-height: 800px;
                border: 4px solid var(--electric-blue);
                border-radius: 20px; /* Скругление углов */
                box-shadow: 0 0 30px var(--hot-pink), 0 0 60px rgba(0,0,0,0.5);
                /* Scrollbar styling for desktop */
                scrollbar-width: thin;
                scrollbar-color: var(--acid-green) #000;
            }
            
            /* Красивый скроллбар для Webkit (Chrome) */
            .app-container::-webkit-scrollbar { width: 8px; }
            .app-container::-webkit-scrollbar-track { background: #000; }
            .app-container::-webkit-scrollbar-thumb { background: var(--acid-green); border-radius: 4px; }

            /* Эффекты наведения мышкой (только для ПК) */
            .btn:hover {
                transform: translateY(-3px) scale(1.02);
                filter: brightness(1.2);
            }
            .click-area:hover {
                cursor: pointer;
                box-shadow: 0 0 30px var(--warning-red);
            }
        }

        /* --- ТИПОГРАФИКА И ЭЛЕМЕНТЫ --- */
        h1, h2 {
            font-family: 'Rubik Glitch', cursive;
            font-size: 2.2rem;
            margin: 10px 0;
            color: var(--hot-pink);
            text-shadow: 2px 2px 0px var(--acid-green);
            animation: glitch 3s infinite;
            text-align: center;
            line-height: 1;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px 0px var(--acid-green); }
            20% { text-shadow: -2px 2px 0px var(--electric-blue); }
            40% { text-shadow: -2px -2px 0px var(--warning-red); }
            60% { text-shadow: 2px -2px 0px var(--hot-pink); }
            100% { text-shadow: 2px 2px 0px var(--acid-green); }
        }

        /* UI */
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }

        input {
            flex: 1;
            background: #000;
            border: 2px solid var(--acid-green);
            color: white;
            font-family: 'Bangers', cursive;
            font-size: 1.2rem; /* 16px+ чтобы iOS не зумил */
            padding: 12px;
            outline: none;
            border-radius: 8px;
        }

        .btn {
            background: var(--hot-pink);
            color: white;
            border: none;
            padding: 16px;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--electric-blue);
            text-transform: uppercase;
            touch-action: manipulation;
            width: 100%;
            margin-bottom: 15px;
            position: relative;
            border-radius: 8px;
            transition: transform 0.1s;
        }

        .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--electric-blue); }

        .btn-back {
            width: auto;
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 1rem;
            padding: 8px 12px;
            z-index: 100;
            transform: rotate(-2deg);
            box-shadow: 2px 2px 0px var(--electric-blue);
        }

        .player-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
        .player-tag { 
            background: var(--electric-blue); 
            color: #000; 
            padding: 5px 10px; 
            font-size: 1.1rem; 
            border-radius: 4px; 
            transform: rotate(var(--rot)); 
        }

        /* SCREENS */
        .screen { 
            display: none; 
            flex-direction: column; 
            height: 100%; 
            justify-content: center; 
            padding-top: 40px; /* Место под кнопку Назад */
        }
        .screen.active { display: flex; animation: fadeUp 0.3s ease-out; }
        
        /* Центрируем контент меню, чтобы он не был растянут */
        #screen-menu { justify-content: center; padding-top: 0; }
        
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* GAME SPECIFICS */
        .card-flip {
            background: #111;
            border: 2px dashed var(--acid-green);
            padding: 20px;
            margin: 20px 0;
            flex-grow: 1;
            max-height: 50vh; /* Чтобы не растягивалось слишком сильно */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            text-align: center;
        }
        .victim-name { color: var(--hot-pink); font-size: 2rem; margin-bottom: 10px; display: block; }
        .task-text { color: white; font-size: 1.4rem; line-height: 1.3; }

        .cylinder {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 8px dashed var(--electric-blue);
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            transition: transform 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .click-area {
            width: 180px;
            height: 180px;
            background: var(--warning-red);
            border-radius: 50%;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border: 6px solid white;
            box-shadow: 0 0 20px var(--warning-red);
        }
        .click-area:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 1. MENU -->
        <div id="screen-menu" class="screen active">
            <h1>TRASH PARTY</h1>
            <p style="text-align: center; color: #666; font-size: 0.9rem; margin-top: -10px;">Universal Edition</p>
            <div style="margin-top: 30px; width: 100%;">
                <button class="btn" onclick="selectGame('tod')" style="background: var(--hot-pink)">Правда / Действие</button>
                <button class="btn" onclick="selectGame('roulette')" style="background: var(--warning-red)">Русская Рулетка</button>
                <button class="btn" onclick="selectGame('clicker')" style="background: var(--electric-blue); color: black;">Спид-Кликер</button>
                <button class="btn" onclick="selectGame('rps')" style="background: var(--acid-green); color: black;">Камень Ножницы</button>
            </div>
        </div>

        <!-- 2. SETUP -->
        <div id="screen-setup" class="screen">
            <button class="btn btn-back" onclick="showScreen('screen-menu')">Меню</button>
            <h2>ИГРОКИ</h2>
            <div class="input-group">
                <input type="text" id="playerName" placeholder="Имя..." onkeypress="handleEnter(event)" autocomplete="off">
                <button class="btn" style="width: auto; padding: 0 20px;" onclick="addPlayer()">+</button>
            </div>
            <div class="player-list" id="playersDisplay"></div>
            <!-- Spacer to push button down -->
            <div style="flex-grow: 1;"></div>
            <button class="btn" style="background: var(--acid-green); color: black;" onclick="launchSelectedGame()">НАЧАТЬ ИГРУ</button>
        </div>

        <!-- 3. GAMES -->
        
        <!-- Truth Or Dare -->
        <div id="screen-tod" class="screen">
            <button class="btn btn-back" onclick="showScreen('screen-menu')">Меню</button>
            <h2>ПРАВДА/ДЕЙСТВИЕ</h2>
            <div class="card-flip">
                <span id="tod-victim" class="victim-name">Игрок</span>
                <span id="tod-task" class="task-text">Выбери категорию...</span>
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button class="btn" style="background: var(--electric-blue); color: black;" onclick="nextTOD('truth')">Правда</button>
                <button class="btn" style="background: var(--warning-red)" onclick="nextTOD('dare')">Действие</button>
            </div>
        </div>

        <!-- Roulette -->
        <div id="screen-roulette" class="screen">
            <button class="btn btn-back" onclick="showScreen('screen-menu')">Меню</button>
            <h2>РУЛЕТКА</h2>
            <p id="roulette-player" style="text-align: center; color: var(--acid-green); font-size: 1.4rem;">Ход: ???</p>
            <div class="cylinder" id="cylinder">💀</div>
            <div id="roulette-msg" style="text-align: center; min-height: 60px; font-size: 1.3rem; margin: 10px 0;">Крути барабан...</div>
            <button class="btn" id="fire-btn" style="background: var(--warning-red)" onclick="fireRoulette()">ВЫСТРЕЛ</button>
            <button class="btn" id="reset-roulette-btn" style="display:none; background: var(--electric-blue); color:black" onclick="initRoulette()">ЗАРЯДИТЬ</button>
        </div>

        <!-- Clicker -->
        <div id="screen-clicker" class="screen">
            <button class="btn btn-back" onclick="showScreen('screen-menu')">Меню</button>
            <h2>КЛИКЕР</h2>
            <p id="clicker-player" style="text-align: center; color: var(--hot-pink)">Готовься: ???</p>
            <div style="text-align: center; margin: 20px 0;">
                <span id="click-timer" style="font-size: 2rem; color: var(--electric-blue)">10.00</span><br>
                <span id="click-count" style="font-size: 4rem; color: white;">0</span>
            </div>
            <div class="click-area" id="click-btn" onclick="countClick()" style="pointer-events: none; opacity: 0.5;">ЖМИ!</div>
            <button class="btn" id="start-clicker-btn" style="margin-top: 20px;" onclick="startClickerRun()">СТАРТ</button>
            <p id="clicker-record" style="text-align: center; color: #888;">Рекорд: 0</p>
        </div>

        <!-- RPS -->
        <div id="screen-rps" class="screen">
            <button class="btn btn-back" onclick="showScreen('screen-menu')">Меню</button>
            <h2>ЦУ-Е-ФА</h2>
            <p id="rps-player-name" style="text-align: center; color: var(--electric-blue); margin-bottom: 30px;">Твой ход</p>
            <div style="display: flex; justify-content: space-around; font-size: 4rem; margin-bottom: 30px;">
                <div onclick="playRPS('rock')" style="cursor: pointer;">🗿</div>
                <div onclick="playRPS('paper')" style="cursor: pointer;">🧻</div>
                <div onclick="playRPS('scissors')" style="cursor: pointer;">✂️</div>
            </div>
            <div id="rps-result" style="text-align: center; font-size: 1.5rem; color: var(--warning-red); min-height: 60px;"></div>
        </div>

    </div>

<script>
    // --- DETECT TELEGRAM ---
    const tg = window.Telegram?.WebApp;
    
    // Безопасная инициализация
    if (tg) {
        tg.ready();
        try {
            tg.expand(); // Пытаемся развернуть на весь экран
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#111111');
        } catch(e) { console.log("Not in Telegram context"); }
    }

    // Helper: Use native popup if in TG, else standard alert
    function safeAlert(msg) {
        if (tg && tg.showPopup) {
            tg.showPopup({ title: 'Info', message: msg, buttons: [{type: 'ok'}] });
        } else {
            alert(msg);
        }
    }
    
    // Helper: Haptic feedback
    function haptic(type) {
        if (tg && tg.HapticFeedback) {
            if(type === 'light') tg.HapticFeedback.impactOccurred('light');
            if(type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
            if(type === 'success') tg.HapticFeedback.notificationOccurred('success');
            if(type === 'error') tg.HapticFeedback.notificationOccurred('error');
        }
    }

    // --- DATA ---
    const tasks = {
        truth: [
            "Кто из присутствующих бесит тебя больше всего?",
            "Какое самое тупое сообщение ты отправлял?",
            "Когда последний раз ты не мылся 2 дня?",
            "Покажи последние 3 фото в галерее.",
            "В кого ты был тайно влюблен?",
            "Что ты своровал в магазине?",
            "Сколько денег у тебя сейчас на карте?",
            "Какую самую странную порнуху ты смотрел?",
            "Кого из этой комнаты ты бы спас первым при зомби-апокалипсисе?",
            "Расскажи о своей самой позорной пьянке.",
            "Ты когда-нибудь нюхал свое нижнее белье?",
            "Какой самый ужасный подарок ты передаривал?",
            "Чью переписку ты бы хотел прочитать?",
            "Ты когда-нибудь писал в раковину?",
            "Какой самый глупый способ, которым ты получил травму?",
            "Если бы тебе пришлось убить одного человека здесь, кто бы это был?",
            "Что самое дорогое ты сломал и скрыл это?",
            "Ты когда-нибудь симулировал болезнь, чтобы не идти на встречу?",
            "Какое прозвище у тебя было в школе?",
            "Что ты делаешь, когда остаешься дома один?",
            "Кто из игроков одевается хуже всех?",
            "Ты когда-нибудь отправлял нюдсы не тому человеку?",
            "Чего ты больше всего боишься в постели?",
            "Ты когда-нибудь врал про свой возраст?",
            "Назови одну черту характера соседа справа, которую ты ненавидишь.",
            "Ты когда-нибудь писал в бассейн?",
            "С кем из бывших ты бы переспал снова?",
            "Какую часть тела ты бы в себе изменил?",
            "Ты когда-нибудь крал деньги у родителей?",
            "Назови самую глупую причину, по которой ты кого-то бросил.",
            "Ты храпишь во сне?",
            "Когда ты последний раз плакал и почему?",
            "Ты ревнуешь своих друзей к другим?",
            "Твое самое странное 'постыдное удовольствие'?",
            "Ты веришь в призраков или инопланетян?",
            "Какую еду ты ненавидишь до тошноты?",
            "Ты когда-нибудь отправлял сообщение, о котором жалел сразу же?",
            "Если бы ты был другого пола на один день, что бы сделал первым делом?",
            "Оцени свою внешность от 1 до 10 честно.",
            "Какой самый странный сон тебе снился?"
        ],
        dare: [
            "Изобрази тверк на 10 секунд.",
            "Дай любому игроку шлепнуть тебя.",
            "Позвони бывшему/бывшей и промяукай.",
            "Выпей стакан воды без рук.",
            "Оближи локоть соседа.",
            "Сделай массаж ног игроку справа.",
            "Съешь ложку чего угодно из холодильника (выбирают другие).",
            "Дай свой телефон на 1 минуту другому игроку.",
            "Стой в планке, пока другие игроки не разрешат встать (макс 1 мин).",
            "Изобрази оргазм громко.",
            "Лизни пол.",
            "Позвони родителям и скажи, что тебя отчислили/уволили.",
            "Опустоши свои карманы.",
            "Пусть игрок слева нарисует усы тебе на лице.",
            "Нюхай носки соседа справа 10 секунд.",
            "Говори с акцентом следующие 3 раунда.",
            "Сделай 20 приседаний прямо сейчас.",
            "Положи лед себе в трусы и жди пока растает.",
            "Выпей шот чего-нибудь соленого.",
            "Отправь последнее фото из галереи 5-му контакту в мессенджере.",
            "Читай рэп про игрока напротив.",
            "Сними один предмет одежды.",
            "Поцелуй руку каждому игроку в комнате.",
            "Изображай обезьяну до следующего хода.",
            "Выпей стакан воды залпом.",
            "Изобрази курицу, которая несет яйцо.",
            "Пусть группа сделает тебе смешную прическу, ходи так 2 раунда.",
            "Съешь зубчик чеснока или кусок лука.",
            "Говори шепотом до следующего своего хода.",
            "Понюхай подмышку соседа слева.",
            "Сделай мостик (или попытайся).",
            "Разреши прочитать твое последнее отправленное СМС вслух.",
            "Изобрази пьяного в стельку человека.",
            "Танцуй медляк со шваброй или стулом.",
            "Съешь кусочек лимона вместе с кожурой.",
            "Позволь накрасить тебе губы (парням тоже).",
            "Сделай селфи с унитазом и выложи в сторис на 5 минут.",
            "Расскажи детский стишок, стоя на стуле.",
            "Засунь палец в ухо соседу и держи 5 секунд.",
            "Покажи историю браузера за сегодня."
        ]
    };

    // --- LOGIC ---
    let players = [];
    let selectedGame = null;
    
    function handleEnter(e) { if(e.key === 'Enter') addPlayer(); }

    function addPlayer() {
        const input = document.getElementById('playerName');
        const name = input.value.trim();
        if (name && !players.includes(name)) {
            players.push(name);
            renderPlayers();
            input.value = '';
            input.focus();
            haptic('light');
        }
    }

    function renderPlayers() {
        document.getElementById('playersDisplay').innerHTML = players.map(p => 
            `<span class="player-tag" style="--rot: ${Math.random()*8-4}deg">${p}</span>`
        ).join('');
    }

    function selectGame(gameType) {
        selectedGame = gameType;
        showScreen('screen-setup');
        haptic('light');
    }

    function launchSelectedGame() {
        if (players.length < 2) { 
            safeAlert("Нужно минимум 2 игрока!"); 
            haptic('error');
            return; 
        }
        
        if (selectedGame === 'tod') initTOD();
        else if (selectedGame === 'roulette') initRoulette();
        else if (selectedGame === 'clicker') initClicker();
        else if (selectedGame === 'rps') initRPS();
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        haptic('light');
    }
    function getRandomPlayer() { return players[Math.floor(Math.random() * players.length)]; }

    // --- TRUTH OR DARE ---
    function initTOD() {
        showScreen('screen-tod');
        document.getElementById('tod-victim').innerText = "???";
        document.getElementById('tod-task').innerText = "Готовься...";
    }

    function nextTOD(type) {
        haptic('light');
        const list = tasks[type];
        const task = list[Math.floor(Math.random() * list.length)];
        const victimEl = document.getElementById('tod-victim');
        const taskEl = document.getElementById('tod-task');
        
        let count = 0;
        const interval = setInterval(() => {
            victimEl.innerText = players[Math.floor(Math.random() * players.length)];
            count++;
            if(count > 8) {
                clearInterval(interval);
                victimEl.innerText = getRandomPlayer();
                taskEl.innerText = task;
                victimEl.style.color = type === 'truth' ? 'var(--electric-blue)' : 'var(--warning-red)';
                haptic('success');
            }
        }, 50);
    }

    // --- ROULETTE ---
    let chambers, bulletPos, currentChamber, roulettePlayerIndex;

    function initRoulette() {
        showScreen('screen-roulette');
        chambers = 6;
        currentChamber = 0;
        bulletPos = Math.floor(Math.random() * 6); 
        roulettePlayerIndex = Math.floor(Math.random() * players.length);
        
        document.getElementById('roulette-msg').innerText = "Барабан прокручен...";
        document.getElementById('roulette-msg').style.color = "white";
        document.getElementById('cylinder').style.transform = "rotate(0deg)";
        document.getElementById('cylinder').innerText = "💀";
        document.getElementById('fire-btn').style.display = "inline-block";
        document.getElementById('reset-roulette-btn').style.display = "none";
        document.querySelector('.app-container').style.background = "rgba(0,0,0,0.95)";
        updateRoulettePlayer();
    }

    function updateRoulettePlayer() {
        document.getElementById('roulette-player').innerText = "Стреляет: " + players[roulettePlayerIndex];
    }

    function fireRoulette() {
        haptic('heavy');
        const cyl = document.getElementById('cylinder');
        const msg = document.getElementById('roulette-msg');
        
        cyl.style.transform = `rotate(${360 + (currentChamber * 60)}deg)`;

        setTimeout(() => {
            if (currentChamber === bulletPos) {
                msg.innerText = "ВЫСТРЕЛ! (Пей)";
                msg.style.color = "var(--warning-red)";
                cyl.innerText = "💥";
                document.querySelector('.app-container').style.background = "#500";
                document.getElementById('fire-btn').style.display = "none";
                document.getElementById('reset-roulette-btn').style.display = "inline-block";
                haptic('error');
            } else {
                msg.innerText = "ПУСТО... Фух.";
                msg.style.color = "var(--acid-green)";
                currentChamber++;
                roulettePlayerIndex = (roulettePlayerIndex + 1) % players.length;
                updateRoulettePlayer();
            }
        }, 300);
    }

    // --- CLICKER ---
    let clickCount = 0;
    let clickSessionRecord = 0;
    let clickTimerInt = null;

    function initClicker() {
        showScreen('screen-clicker');
        resetClickerUI();
    }

    function resetClickerUI() {
        document.getElementById('clicker-player').innerText = "След. игрок: " + getRandomPlayer();
        document.getElementById('click-count').innerText = "0";
        document.getElementById('click-timer').innerText = "10.00";
        const btn = document.getElementById('click-btn');
        btn.style.pointerEvents = "none";
        btn.style.opacity = "0.5";
        btn.innerText = "ЖМИ!";
        document.getElementById('start-clicker-btn').style.display = "inline-block";
        clickCount = 0;
    }

    function startClickerRun() {
        document.getElementById('start-clicker-btn').style.display = "none";
        const btn = document.getElementById('click-btn');
        btn.innerText = "3...";
        
        setTimeout(() => { btn.innerText = "2..."; }, 700);
        setTimeout(() => { btn.innerText = "1..."; }, 1400);
        setTimeout(() => {
            btn.innerText = "🔥";
            btn.style.pointerEvents = "auto";
            btn.style.opacity = "1";
            btn.style.background = "var(--hot-pink)";
            haptic('success');
            
            const startTime = Date.now();
            clickTimerInt = setInterval(() => {
                let elapsed = (Date.now() - startTime) / 1000;
                let left = 10 - elapsed;
                if (left <= 0) {
                    endClickerGame();
                } else {
                    document.getElementById('click-timer').innerText = left.toFixed(2);
                }
            }, 50);
        }, 2100);
    }

    function countClick() {
        clickCount++;
        document.getElementById('click-count').innerText = clickCount;
        if(clickCount % 5 === 0) haptic('light');
        const btn = document.getElementById('click-btn');
        btn.style.transform = "scale(0.9)";
        setTimeout(() => btn.style.transform = "scale(1)", 50);
    }

    function endClickerGame() {
        clearInterval(clickTimerInt);
        document.getElementById('click-timer').innerText = "0.00";
        const btn = document.getElementById('click-btn');
        btn.style.pointerEvents = "none";
        btn.style.opacity = "0.5";
        btn.style.background = "var(--warning-red)";
        btn.innerText = "СТОП";
        
        let msg = "";
        if (clickCount > clickSessionRecord) {
            clickSessionRecord = clickCount;
            document.getElementById('clicker-record').innerText = "🔥 РЕКОРД: " + clickSessionRecord;
            msg = `НОВЫЙ РЕКОРД: ${clickCount}!`;
            haptic('success');
        } else {
            msg = `Результат: ${clickCount}`;
        }
        
        safeAlert(msg);
        setTimeout(resetClickerUI, 2000);
    }

    // --- RPS ---
    function initRPS() {
        showScreen('screen-rps');
        document.getElementById('rps-player-name').innerText = getRandomPlayer() + ", твой ход!";
        document.getElementById('rps-result').innerText = "";
    }

    function playRPS(choice) {
        const bots = ['rock', 'paper', 'scissors'];
        const botChoice = bots[Math.floor(Math.random() * 3)];
        const resDiv = document.getElementById('rps-result');
        let msg = "";
        
        if (choice === botChoice) { msg = "НИЧЬЯ! ПЕЙ!"; resDiv.style.color = "white"; }
        else if (
            (choice === 'rock' && botChoice === 'scissors') ||
            (choice === 'paper' && botChoice === 'rock') ||
            (choice === 'scissors' && botChoice === 'paper')
        ) { 
            msg = "ПОБЕДА!"; resDiv.style.color = "var(--acid-green)"; 
            haptic('success');
        } else { 
            msg = "ЛУЗЕР! ПЕЙ!"; resDiv.style.color = "var(--warning-red)"; 
            haptic('error');
        }
        
        resDiv.innerHTML = `Бот: ${botChoice === 'rock'?'🗿':(botChoice==='paper'?'🧻':'✂️')} <br> ${msg}`;
        setTimeout(() => {
            document.getElementById('rps-player-name').innerText = getRandomPlayer() + ", теперь ты!";
            resDiv.innerText = "";
        }, 2500);
    }
</script>
</body>
</html>
